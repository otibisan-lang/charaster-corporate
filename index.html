、一度は新キャラ「ド情ちゃん」への交代が発表されたが、ファンの猛反発を受けてわずか数時間で撤回された",imageUrl:""},{id:"ponta",name:"ポンタ（Ponta）",debutYear:2010,company:"三菱商事ほか",trivia:"目の周りの白い模様は、模様ではなくアイマスク……というネタを、公式がエイプリルフールに出したことがある。※アイマスクではありません。",imageUrl:""},{id:"nanaco",name:"ナナコ（nanaoco）",debutYear:2007,company:"セブン＆アイ",trivia:"苦手な食べ物は「ちくわ」。キリンの首となんとなく似てるから。誕生日は7月7日。",imageUrl:""},{id:"korasho",name:"コラショ",debutYear:1998,company:"ベネッセ",trivia:"「コラショ」という名前は、1年生が自分の体よりも大きなランドセルを初めて背負うときの「よいしょこらしょ」というかけ声からつけられた",imageUrl:""},{id:"licca_chan",name:"リカちゃん",debutYear:1967,company:"タカラトミー",trivia:"公式設定で父親はフランス人のミュージシャンで、リカちゃんはハーフという設定",imageUrl:""},{id:"patchy",name:"火ぐまのパッチョ",debutYear:2006,company:"東京ガス",trivia:"「火ぐまの国」の王子様という設定。パッチョの相棒の電力キャラクターは「電パッチョ」",imageUrl:""},{id:"umaemon",name:"うまえもん",debutYear:1978,company:"やおきん",trivia:"遠い宇宙のとある星からやってきた異星人とされている。「ドラえもん」と姿が似ているが、公式による説明はない。ちなみに「ドラえもん」の方がデビュー年は古い",imageUrl:""},{id:"kewpie_chan",name:"キューピーちゃん",debutYear:1909,company:"キユーピー",trivia:"日本発のキャラクターではなく、アメリカのイラストレーターが1909年に生み出したデザインが元になっている",imageUrl:""},{id:"bibendum",name:"ビバンダム（ミシュランマン）",debutYear:1898,company:"ミシュラン",trivia:"1898年生まれで、世界最古の企業キャラクターといわれている。体が白いのは、当時のタイヤがまだカーボンブラックを含まない「ホワイトタイヤ」だったため。",imageUrl:""},{id:"rakuten_panda",name:"お買いものパンダ",debutYear:2013,company:"楽天",trivia:"楽天のキャンペーンでおなじみのパンダ。「お買いものパンダ」として楽天経済圏のイメージを担う。",imageUrl:""},{id:"myakumyaku",name:"ミャクミャク",debutYear:2022,company:"万博協会",trivia:"大阪・関西万博の公式キャラ。オフィシャルにはミャクミャクとして知られる不思議な姿が話題になった。",imageUrl:""},{id:"kiwi_brothers",name:"キウイブラザーズ",debutYear:2016,company:"ゼスプリ",trivia:"「ブラザーズ」と名乗っているが実は兄弟ではない。「ブラザーズ」は兄弟のブラザーズではなくコンビ名で、「友達よりももっと大切な仲間」という設定。2021年に公式SNSがこれを明かしたとき「嘘だと言って」とSNSが騒然となった。",imageUrl:""},{id:"domokun",name:"どーもくん",debutYear:1998,company:"NHK",trivia:"元々1年限定のキャラクターとして作られたが、予想外の人気でNHK全体のマスコットに昇格。機嫌を損ねると「キョーレツなおならをする」という公式設定がある",imageUrl:""},{id:"suica_penguin",name:"Suicaのペンギン",debutYear:2001,company:"JR東日本",trivia:"個別の名前はなく「Suicaのペンギン」と呼ばれるSuicaのイメージキャラ。JR東日本は2026年度末をもってイメージキャラから卒業し新キャラへバトンタッチする予定（発表時点）。",imageUrl:""},{id:"peko_chan",name:"ペコちゃん",debutYear:1950,company:"不二家",trivia:"「ペコちゃん人形」は1998年に立体商標第1号として特許庁より認められている",imageUrl:""},{id:"kenketsu_chan",name:"けんけつちゃん",debutYear:2005,company:"厚生労働省",trivia:"よく見るキャラクターの名前は実は「チッチ」。A・O・B・AB型それぞれの妖精がおり、チッチはそのリーダー。これら全員の総称が「けんけつちゃん」",imageUrl:""},{id:"gold_bear",name:"ゴールドベア（ハリボー）",debutYear:1922,company:"ハリボー",trivia:"ハリボーの社名は創業者ハンス・リーゲルとボンの地名を組み合わせたもの",imageUrl:""},{id:"docomodake",name:"ドコモダケ",debutYear:2005,company:"NTTドコモ",trivia:"実は大家族で、チチ・ハハ・ムスメ・ムスコなど13匹の家族がいる。ムスメドコモダケのカレシはSNS投票で選ばれ、2008年に結婚。2010年にはベイビドコモダケも誕生した。",imageUrl:""},{id:"softbank_otosan",name:"お父さん（ソフトバンクの白い犬）",debutYear:2007,company:"ソフトバンク",trivia:"お父さんの本名は「白戸次郎」で、元々は人間。ひょんなことから犬に姿を変えた。声優は北大路欣也",imageUrl:""},{id:"carl_ojisan",name:"カールおじさん",debutYear:1976,company:"明治",trivia:"1968年の発売当初はエキストラの脇役の1人だったが、人気が出てメインキャラクターに昇格した",imageUrl:""},{id:"glico_runner",name:"道頓堀グリコサイン（走る男）",debutYear:1935,company:"江崎グリコ",trivia:"グリコ販売当初のデザインは「顔が怖い」と言われたため、2代目以降は表情を中心にデザインが変更された。特定のモデルはいない",imageUrl:""},{id:"koala_march",name:"コアラのマーチくん",debutYear:1984,company:"ロッテ",trivia:"絵柄は全500種類にのぼる。「ハートを持ったコアラはレア」という説があるが、ロッテ公式によれば「すべての絵柄は均等な確率で入っている」とのこと",imageUrl:""},{id:"karaage_kun",name:"からあげクン",debutYear:1986,company:"ローソン",trivia:"実は「にわとり」ではなく、「からあげクン王国」に棲む妖精である",imageUrl:""},{id:"pon_de_lion",name:"ポン・デ・ライオン",debutYear:2004,company:"ダスキン（ミスド）",trivia:"首の「ポン・デ・リング」はお腹が空いた時に自分で外して食べてしまい、食べ終わるとしっぽからまた新しいポン・デ・リングが生成されるという生態を持つ",imageUrl:""},{id:"aflac_duck",name:"アフラックダック",debutYear:2001,company:"アフラック生命",trivia:"アフラック生命保険CMのアヒル着ぐるみキャラ。短いコント調の説明スタイルが印象に残る。",imageUrl:""},{id:"ochaken",name:"お茶犬",debutYear:1998,company:"伊藤園",trivia:"伊藤園のお茶缶シリーズに登場する犬たちのキャラ。お茶っ葉の箱や缶に描かれたゆるい絵柄が魅力。",imageUrl:""},{id:"paypay_pe",name:"ペイペ",debutYear:2020,company:"PayPay",trivia:"QRコード決済PayPayのマスコット「ペイペ」。キャンペーンやアプリ画面でスマホ決済のイメージを広げた。",imageUrl:""},{id:"koume",name:"小梅",debutYear:1974,company:"ロッテ",trivia:"ロッテのキャンディ「小梅」のパッケージキャラ。梅干し風味のど菓子として長く売り場にある。",imageUrl:""},{id:"kinoyama_takesato",name:"きの山さん・たけ里ブラザーズ",debutYear:2008,company:"明治",trivia:"明治「きのこの山」「たけのこの里」の兄妹キャラ。パッケージ絵が並ぶとストーリー性が楽しめる。「たけさと」と呼ぶ読みもある。",imageUrl:""},{id:"kappa_ebisen",name:"かっぱえびくん（かっぱえびせん）",debutYear:2012,company:"カルビー",trivia:"カルビー「かっぱえびせん」の公式キャラ「かっぱえびくん」。パッケージやCMでかっぱ姿がおなじみ。",imageUrl:""},{id:"bisco_boya",name:"ビスコ坊や",debutYear:1933,company:"江崎グリコ",trivia:"江崎グリコ「ビスコ」の坊やキャラ。戦前から続くビスケットのパッケージ絵として長い歴史を持つ。",imageUrl:""},{id:"onigiri_boya",name:"おにぎり坊や",debutYear:1969,company:"マスヤ",trivia:"マスヤ「おにぎりせんべい」の坊やキャラ。三角形のおにぎり型せんべいとセットで記憶に残る。",imageUrl:""},{id:"suzy_chan",name:"スージーちゃん",debutYear:1966,company:"山崎製パン",trivia:"実は実在する人物で、撮影当時は東京在住の3歳のアメリカ人の女の子。「食べるふり」だけでよかった撮影で、パンが好きすぎて本当に食べ続け、撮影が終わるまでに2斤を完食してしまったという逸話がある",imageUrl:""},{id:"yocchan_ika",name:"よっちゃんイカ",debutYear:1977,company:"よっちゃん食品工業",trivia:"「よっちゃん」は創業者・金井芳雄氏の幼少期のあだ名が由来",imageUrl:""},{id:"shigemon",name:"シゲモン（シゲキックス）",debutYear:2006,company:"UHA味覚糖",trivia:"シゲキックスのキャラクターは実はシゲモン1人ではなく、シゲーダ、シゲボッシー、シゲーラなど多数いる。シゲモンはそのリーダー格",imageUrl:""},{id:"chocobi_waniyamasan",name:"チョコビ（ワニ山さん）",debutYear:2006,company:"バンダイ/東ハト",trivia:"クレヨンしんちゃんの好物として作中で描かれたことがきっかけで商品化。キャラクターデザインは作者の臼井儀人",imageUrl:""},{id:"caprico_kapusuke",name:"カプすけ（カプリコ）",debutYear:2012,company:"江崎グリコ",trivia:"約5本に1本の確率でカプリコの側面に現れる「カプリコ占い」のキャラクターだが、コーン部分に現れるものは数万本に1本というレア中のレアが存在する",imageUrl:""},{id:"nerune",name:"ねるね（ねるねるねるね）",debutYear:1986,company:"クラシエフーズ",trivia:"お菓子の発売は1986年だが、キャラクター「ねるね」の登場は2005年。幼児向け雑誌でマンガが連載されていたこともある",imageUrl:""},{id:"morokoshi_rintaro",name:"もろこしりんたろう",debutYear:1982,company:"菓道",trivia:"かえるのおまわりさん（キャベツ太郎）・うまえもん（うまいぼう）と同じ菓道製で、「菓道三兄弟」と呼ばれることがある",imageUrl:""},{id:"poteko_kun",name:"ポテコ（ポテコくん）",debutYear:2006,company:"東ハト",trivia:"同じ東ハトの「なげわ」のキャラクター「なげわくん」とはいとこ同士という設定",imageUrl:""},{id:"petit_kuma",name:"プチクマ",debutYear:2011,company:"ブルボン",trivia:"仲間の数はプチシリーズの種類と同じ24種類。毎年6月24日は日本記念日協会公認の「プチクマの日」で、毎月24日は「ブルボン・プチの日」となっている",imageUrl:""},{id:"bokun_habanero",name:"暴君ハバネロ",debutYear:2003,company:"東ハト",trivia:"キャラクターを題材にした4コマ漫画が2006年から2010年まで『小学五年生』（小学館）で連載されていた",imageUrl:""},{id:"yanyan_tsukebo",name:"ヤンヤン（ヤンヤンつけボー）",debutYear:1979,company:"明治",trivia:"パッケージのパンダキャラの名前は「ヤンヤン」と思われがちだが、明治公式によると「名前はまだない」",imageUrl:""},{id:"wasagyu",name:"わさぎゅ〜",debutYear:2005,company:"三和豆友食品",trivia:"三和豆友食品のピリ辛・わさび系スナック「わさぎゅ〜」。語呂とキャラでインパクトを出す。",imageUrl:""},{id:"bey_chan",name:"ベイちゃん（ベビースターラーメン）",debutYear:1988,company:"おやつカンパニー",trivia:"実はベビースターラーメンの2代目キャラクターで、初代は名前のない女の子キャラが約30年間務めていた",imageUrl:""},{id:"butamen_kun",name:"ブタメンくん",debutYear:1993,company:"おやつカンパニー",trivia:"1993年の発売当初からパッケージに登場していたが、長年名前がなかった。2021年にSNS投票で「ブタメンくん」に決定。目がぐるぐるなのは「あまりのおいしさに目が回っている」から",imageUrl:""},{id:"potapota_obaachan",name:"ぽたぽた焼きのおばあちゃん",debutYear:1986,company:"亀田製菓",trivia:"2023年に人気絵本作家・ヨシタケシンスケによる新しいおばあちゃんにリニューアル。「りんごかもしれない」などで知られる作家が手がけたことで話題になった",imageUrl:""},{id:"red_mms",name:"レッド (M&M's)",debutYear:1954,company:"マース",trivia:"M&M'sチョコレートのカラフルキャラの一角レッド。一粒ごとに個性がある設定で世界中で展開。",imageUrl:""},{id:"aanpan_ojisan",name:"あんぱんおじさん（チョコあ～んぱん）",debutYear:1986,company:"ブルボン",trivia:"長年「ブルボンのおじさん」と呼ばれ、名前があることを知らないファンも多い。発売30周年を機に姪っ子の「メイちゃん」が新キャラクターとして登場した",imageUrl:""},{id:"oyatsu_panda",name:"おやつパンダ",debutYear:2002,company:"前田製菓",trivia:"前田製菓「おやつパンダ」のパンダキャラ。世代交代があり現在は三代目が担当する説明もある（パンダ世代による）。",imageUrl:""},{id:"dakkozushi",name:"だっこずし",debutYear:2014,company:"あきんどスシロー",trivia:"“まぐろラッコ”をはじめ30以上の仲間たちがいる、スシロー公式のオリジナルキャラクター。何があっても絶対にネタを話さないという特性を持つ。",imageUrl:""},{id:"kyabetsu_taro",name:"カエルのおまわりさん（キャベツ太郎）",debutYear:1981,company:"菓道",trivia:"キャベツ畑を見張るカエルという設定。カエルは害虫を食べるがキャベツは食べないため番人に選ばれたという説がある",imageUrl:""},{id:"puccyo_kun",name:"ぷっちょくん",debutYear:2007,company:"UHA味覚糖",trivia:"一人称は「わい」の関西弁キャラ。マッチョな「まっちょくん」は別キャラではなく、ぷっちょくんが力を入れた状態で、力を抜くとぷっちょくんに戻るという設定。",imageUrl:""},{id:"kuppy_lam",name:"クッピー＆ラム",debutYear:1963,company:"カクダイ製菓",trivia:"最初のキャラクター案は某有名ねずみキャラクターに似ていたため版権元からクレームがつきボツになった経緯がある",imageUrl:""},{id:"sakusaku_panda",name:"さくさくぱんだ",debutYear:1996,company:"カバヤ食品",trivia:"おっちょこちょいで元気な男の子という設定で、表情はなんと、70種類以上あるらしい。",imageUrl:""},{id:"chi_bo",name:"チー坊（チチヤス）",debutYear:1953,company:"チチヤス",trivia:"もともとは社員の落書きが起源で、誕生の詳しい経緯は今では謎。5代目まで存在するが、現在活躍しているのは2007年に復活した初代デザイン。",imageUrl:""},{id:"babo_chan",name:"バボちゃん",debutYear:1977,company:"フジテレビ",trivia:"デザインは「およげ！たいやきくん」のたいやきを描いた田島司さんが担当。また現在使用されているものとしては最古のテレビ関連のマスコットキャラクターでもあるらしい。",imageUrl:""},{id:"turn_ouji",name:"ターン王子（ハッピーターン）",debutYear:2009,company:"亀田製菓",trivia:"「プリンス・ハッピー・ターン・パウダリッチ」という本名を持つ設定。誕生当初は社内で「なにこのパイナップルみたいなもの？」と不評だったらしい。",imageUrl:""},{id:"apollo_chan",name:"アポロちゃん",debutYear:1997,company:"明治",trivia:"1997年のキャラクター誕生以来、ファンから「ぬいぐるみがほしい」という声が絶えなかったが、初めてぬいぐるみ化されたのはキャラクター誕生から28年後の2025年のこと。",imageUrl:""},{id:"yukimi_usagi",name:"雪見うさぎ",debutYear:2013,company:"ロッテ",trivia:"雪見だいふくは1981年発売だが、パッケージに雪見うさぎが登場したのは2013年頃。さらに付属フォークにも雪見うさぎ柄のレア版が存在する。",imageUrl:""},{id:"toppo_noppo_kun",name:"ノッポトッポちゃん（トッポ）",debutYear:1994,company:"ロッテ",trivia:"公式設定では「チョコレートが本体で、プレッツェルは一張羅（衣服）」ということになっている。",imageUrl:""},{id:"nekoichi",name:"Neco壱（ネコイチ）",debutYear:2023,company:"壱番屋",trivia:"ココイチのカレーが好きすぎてカレー色に染まってしまったネコたち。彼らの頭には、それぞれの推しトッピングが乗っている。",imageUrl:""},{id:"pocchi_kun",name:"ポッチくん（ポテトフライ）",debutYear:1992,company:"東豊製菓",trivia:"名前は公募で2001年に決定。2016年放映のアニメ「だがしかし」に登場したことで改めて注目を集めた。",imageUrl:""},{id:"kaappa_kun",name:"カッパーくん",debutYear:2017,company:"JX金属",trivia:"JX金属の資源・金属リサイクルを伝えるカッパモチーフのマスコット「カッパーくん」。銅の語呂で親しみやすくしたキャラ。",imageUrl:""},{id:"jagao",name:"じゃがお（じゃがりこ）",debutYear:1995,company:"カルビー",trivia:"カルビー「じゃがりこ」関連のじゃがいもキャラ「じゃがお」。カップスナックの世界観を広げる。",imageUrl:""},{id:"ototto_totomaru",name:"鯨野とと丸（おっとっと）",debutYear:1982,company:"森永製菓",trivia:"1982年の発売当初は名前がなく「赤いくじら」と呼ばれていたが、1996年に「名前がないのはかわいそう」として命名キャンペーンを実施。47,004通の応募の中から選ばれて現在の名前に決定した。",imageUrl:""},{id:"barin_borin",name:"バリン・ボリン（ばかうけ）",debutYear:1990,company:"栗山米菓",trivia:"やなせたかしによるデザインで、キャラクターのみならず、「バリン アンド ボリン」という歌まで作ってもらえたという逸話がある（しかも、おまけで）",imageUrl:""},{id:"polinky",name:"スリーポリンキーズ（ポリンキー）",debutYear:1990,company:"湖池屋",trivia:"がんばり屋のジャン、ハンサムなポール、おっちょこちょいなベルの3人組。踊りのアルバイトをしながら絵の勉強中という設定",imageUrl:""},{id:"julius_pringles",name:"ジュリアス・プリングルズ",debutYear:1967,company:"ケロッグ",trivia:"販売当時使用されていた缶の硬い印象を和らげるために生まれたキャラクターで、モデルは1800年代後半のアメリカのパン屋の店主。",imageUrl:""},{id:"marble_wanchan",name:"マーブルわんちゃん（マーブルチョコ）",debutYear:1961,company:"明治",trivia:"採用理由について明治の担当者は「ぬいぐるみの試作がブサイクだったから。かわいいものは3日で飽きるがブサイクなものは愛着が湧く」と後に暴露。デザイナー本人は大ショックだったという。",imageUrl:""},{id:"ajipanda",name:"アジパンダ（味の素）",debutYear:2005,company:"味の素",trivia:"キャラクター候補には戦隊ヒーローや国民的アニメキャラ案もあったが、デザイナーが瓶を眺めていてパンダを思いついたことで決まった経緯がある。",imageUrl:""},{id:"kokko_chan",name:"コッコちゃん（のりたま）",debutYear:2003,company:"丸美屋食品工業",trivia:"にわとりは「コッコちゃん」で、一緒にいるひよこたちは「ピヨちゃん」。",imageUrl:""},{id:"edo_murasaki_hito",name:"のり平（ごはんですよ！）",debutYear:1958,company:"桃屋",trivia:"キャラクターは三木のり平が新聞広告に自ら描いた似顔絵が原点。1999年に本人が他界した後は、実の息子・小林のり一が声を引き継いでいる。",imageUrl:""},{id:"kero_koro",name:"ケロちゃん・コロちゃん（コーワのカエル）",debutYear:1949,company:"興和",trivia:"「病気がケロリと治る」語呂合わせがモチーフの由来。カエルキャラの初登場は1949年で、2人組になったのは1977年。",imageUrl:""},{id:"kaba_kun",name:"カバくん（うがい薬）",debutYear:1985,company:"明治",trivia:"長年「イソジン」のキャラクターとして親しまれたが、2016年にブランド契約が終了。「イソジン」の名前はライバル会社へ移り、カバくんは明治に残留した。",imageUrl:""},{id:"peepo_kun",name:"ピーポくん",debutYear:1987,company:"警視庁",trivia:"ピーポくんは特定の動物ではなく、いろいろな動物の可愛らしい部分をイメージ化して作られた",imageUrl:""},{id:"my_na_chan",name:"マイナちゃん",debutYear:2014,company:"デジタル庁（総務省）",trivia:"郵政省が1999年に使用したキャラクター「11桁うさぎ」を流用したのではという疑惑があったが、デジタル庁の担当者は「流用ではない」と説明したらしい。",imageUrl:""}];function wE(e){const t=[],i=String(e||"");let r=i.indexOf(","),l=0,o=!1;for(;!o;){r===-1&&(r=i.length,o=!0);const c=i.slice(l,r).trim();(c||!o)&&t.push(c),l=r+1,r=i.indexOf(",",l)}return t}function Dy(e,t){const i={};return(e[e.length-1]===""?[...e,""]:e).join((i.padRight?" ":"")+","+(i.padLeft===!1?"":" ")).trim()}const xN=/^[$_\p{ID_Start}][$_\u{200C}\u{200D}\p{ID_Continue}]*$/u,CN=/^[$_\p{ID_Start}][-$_\u{200C}\u{200D}\p{ID_Continue}]*$/u,NN={};function BE(e,t){return(NN.jsx?CN:xN).test(e)}const vN=/[ \t\n\f\r]/g;function DN(e){return typeof e=="object"?e.type==="text"?UE(e.value):!1:UE(e)}function UE(e){return e.replace(vN,"")===""}class ds{constructor(t,i,r){this.normal ## このゲームの説明

このゲームは「キャラスター」といいます。  
音楽の年をあてる「HITSTER」というゲームをモチーフにしています。

> 着想のもとになったボードゲーム HITSTER（音楽のヒット年を並べるゲーム）も、ぜひ [公式情報](https://hitstergame.com/ja-jp/) からご覧ください。

<div class="mt-4 rounded-2xl border-2 border-theme-blue/35 bg-[#EAF4FF] p-4 text-sm text-gray-700 leading-relaxed">
  <p class="font-black text-theme-blue mb-2">人数・時間・対象年齢の目安</p>
  <ul class="list-disc pl-5 space-y-1.5 marker:text-theme-blue/70">
    <li>推奨人数は<strong>2名～10名</strong>です。</li>
    <li><strong>6名以上</strong>になる場合は<strong>チーム戦</strong>もおすすめです。</li>
    <li><strong>2人</strong>でプレイする場合の目安は、<strong>1プレイ10～15分程度</strong>です。</li>
  </ul>
  <p class="mt-3 pt-3 border-t border-theme-blue/25 leading-relaxed">
    <strong>対象年齢の目安：</strong>
    <strong>10歳以上</strong>（保護者の付き添い・補助がある場合は<strong>8歳から</strong>）。
    キャラクター名と西暦年をふせんに自分で書くため、<strong>ひらがな・数字の読み書き</strong>ができることが望ましいです。
  </p>
</div>

<div class="grid md:grid-cols-2 gap-6 mt-4">
  <div class="bg-theme-bg p-6 rounded-3xl border-2 border-dashed border-gray-300">
    <h3 class="text-xl font-black mb-3 flex items-center gap-2">
      <span class="bg-white w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm">1</span> 準備物
    </h3>
    <ul class="text-sm leading-relaxed text-gray-600 list-disc pl-5 space-y-1.5 marker:text-gray-500">
      <li>机</li>
      <li>ふせんの束（人数×15枚程度）</li>
      <li>鉛筆を参加人数分</li>
    </ul>
  </div>
  <div class="bg-theme-bg p-6 rounded-3xl border-2 border-dashed border-gray-300">
    <h3 class="text-xl font-black mb-3 flex items-center gap-2">
      <span class="bg-white w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm">2</span> 起点を決める
    </h3>
    <p class="text-sm leading-relaxed text-gray-600">
      このアプリは<strong>司会用の端末を1台</strong>使います。<br />
      まず順番を決めます。じゃんけんをして、勝った人から時計回りに行います。<br />
      次に、起点となるキャラ（全員共通）を用意します。司会が赤色の「答えをみる」ボタンを押し、表示されたデビュー年とキャラ名を全員に伝えます。
      各プレイヤーは、<strong>デビュー年とキャラ名</strong>を<strong>1枚目のふせん</strong>に書き、自分の前のテーブルに貼ってください。
      全員が起点のふせんを用意できたら、<strong>ゲーム開始</strong>です。
    </p>
  </div>
</div>

<h3 class="text-2xl font-black font-display uppercase tracking-tight mt-8 mb-0 text-gray-900">遊び方</h3>

<div class="space-y-4 text-gray-700 bg-white p-6 rounded-3xl border-4 border-theme-bg shadow-inner">
  <div class="flex gap-4">
    <div class="bg-theme-coral text-white font-bold w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-sm tabular-nums mt-0.5">1</div>
    <p class="text-sm min-w-0">キャラクターを確認します。プレイヤーはGoogle画像検索でキャラクターを確認し、その「デビュー年」を<strong>予想</strong>して、ふせんを並べてください。</p>
  </div>
  <div class="flex gap-4">
    <div class="bg-theme-blue text-white font-bold w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-sm tabular-nums mt-0.5">2</div>
    <p class="text-sm min-w-0">
      正解が他の年より<strong>古いか新しいか</strong>で見当をつけ、正しいと思われる位置に貼り付けます。プレイヤー側から見て奥が古く、手前が新しい順番になります。
    </p>
  </div>
  <div class="flex gap-4">
    <div class="bg-theme-green text-white font-bold w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-sm tabular-nums mt-0.5">3</div>
    <p class="text-sm min-w-0">
      予想ができたら、<strong>「答えをみる」</strong>ボタンを押して確認します。正解だったら、キャラクター名とデビュー年をふせんに書きます。
      （不正解だった場合は、何も書かず、そのふせんは次の自分の番に使います）
    </p>
  </div>
  <p class="text-sm text-gray-700 border-t border-gray-100 pt-3 mt-1 pl-11">
    ふせんを最初に10枚並べられた人が勝ちです。または、問題がなくなったときに一番多くふせんを並べられていた人が勝ちです。
  </p>
</div>

<div class="bg-theme-trivia p-6 rounded-3xl border-2 border-theme-yellow text-xs not-italic text-gray-600 mt-4 leading-relaxed">
  ※デビュー年がすでにあるふせんと<strong>同じ年</strong>だった場合、<strong>ふせんが隣り合っていれば正解</strong>です。
</div>
